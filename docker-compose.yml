version: '3.8'

services:
  limadata-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limadata-mcp

    environment:
      LIMADATA_API_KEY: ${LIMADATA_API_KEY}
      NODE_ENV: production

    # Required for MCP protocol (stdio communication)
    stdin_open: true
    tty: true

    # For debugging
    # ports:
    #   - "9999:9999"

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
